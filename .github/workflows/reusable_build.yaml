name: 'Reusable: Build and push image'

# This is a reusable build step, that is supposed to handle the generic task of building a docker
# image and pushing it to a repo.
# This action should be as generic as possible. Maybe extract it to a repo
#
# TODO: Could be made more customizable with: `jq`, `fromJSON`, `toJSON` and `join`

on:
  workflow_call:
    inputs:
      repository_url:
        description: 'Url to push build image to'
        type: string
        required: true
      images:
        description: 'Images arguments for docker/metadata-action'
        type: string
        required: true
      flavor:
        description: 'Flavor argument for docker/metadata-action'
        type: string
        required: false
      tags:
        description: 'Tags argument for docker/metadata-action'
        type: string
        required: false
        default: |
          type=semver,pattern={{version}},priority=1000
          type=schedule,priority=900
          type=sha,format=long,prefix=git-,priority=800
      reuse_images:
        description: >-
          Whitespace-separated list of other image names in the same registry. If one of them
          (or the target image itself) already has an image for the current commit, it is
          retagged instead of being built again.
        type: string
        required: false
        default: ''
      force_rebuild:
        description: 'Always build the image, even if one already exists for the current commit'
        type: boolean
        required: false
        default: false
    secrets:
      REGISTRY_USERNAME:
        description: 'Username for registry login'
        required: true
      REGISTRY_TOKEN:
        description: 'Password for registry login'
        required: true
    outputs:
      tags:
        description: List of set tags
        value: ${{ jobs.build.outputs.tags }}
      labels:
        description: Label output
        value: ${{ jobs.build.outputs.labels }}
      json:
        description: JSON output
        value: ${{ jobs.build.outputs.json }}

jobs:
  build:
    environment: deploy
    runs-on: 'ubuntu-latest'
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ inputs.images }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ inputs.repository_url }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # The image does not contain anything stage-specific, so an image which was already built
      # from the same commit (e.g. for another stage) can be reused as is.
      - name: Look for an existing image built from this commit
        id: existing
        if: ${{ !inputs.force_rebuild }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATES: ${{ inputs.images }} ${{ inputs.reuse_images }}
        run: |
          sha_tag="$(grep -oEm1 'git-[0-9a-f]{40}$' <<< "${TAGS}" || true)"
          if [[ -z "${sha_tag}" ]]; then
            echo "No git-<sha> tag configured, building from scratch."
            exit 0
          fi
          for image in ${CANDIDATES}; do
            if docker buildx imagetools inspect "${image}:${sha_tag}" > /dev/null 2>&1; then
              echo "Found existing image ${image}:${sha_tag}"
              echo "source=${image}:${sha_tag}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "No image at ${image}:${sha_tag}"
          done
          echo "No existing image found, building from scratch."
      - name: Retag existing image
        if: steps.existing.outputs.source
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ steps.existing.outputs.source }}
        run: |
          args=()
          while read -r tag; do
            [[ -n "${tag}" ]] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${SOURCE}"
      - uses: docker/setup-qemu-action@v4
        if: ${{ !steps.existing.outputs.source }}
      - uses: docker/build-push-action@v7
        if: ${{ !steps.existing.outputs.source }}
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
